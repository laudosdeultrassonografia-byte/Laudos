<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laudos de ultrassom</title>
<style>
:root{--bg:#f2f5f4;--ink:#14262b;--mut:#5d7176;--line:#d3dcdc;--acc:#0f6b6b;--acc2:#0b5252;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
button{cursor:pointer;border:0;border-radius:6px;padding:10px 16px;background:var(--acc);color:#fff;font-weight:600}
button:hover{background:var(--acc2)}
button.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.sec:hover{background:#e9efee}
.hide{display:none!important}
#login{max-width:360px;margin:12vh auto;padding:0 20px}
#login h1{font-size:1.6rem;margin:0 0 4px}
#login p{color:var(--mut);margin:0 0 16px}
#login button{width:100%;margin-top:18px}
.err{color:#a3262a;font-size:.9rem;margin-top:10px;min-height:1.2em}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--ink);color:#fff}
header b{font-size:1.05rem}
header button{background:transparent;border:1px solid #5d7176;padding:6px 12px}
.grid{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:20px;padding:20px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.row{display:grid;grid-template-columns:1fr 90px;gap:10px}
h2{font-size:1rem;margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line)}
h2:first-child{border:0;margin:0;padding:0}
.report{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:28px 32px;font:15.5px/1.6 Georgia,"Times New Roman",serif;white-space:pre-wrap;min-height:60vh}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hist button{display:block;width:100%;text-align:left;margin-top:6px;font-weight:400}
.msg{font-size:.9rem;color:var(--acc);min-height:1.2em;margin-left:4px;align-self:center}
@media print{body{background:#fff}header,.left,.bar{display:none!important}.grid{display:block;padding:0}.report{border:0;padding:0}}
</style>
</head>
<body>

<section id="login">
  <h1>Laudos de ultrassom</h1>
  <p>Entre com o seu e-mail e senha.</p>
  <label for="email">E-mail</label>
  <input id="email" type="email" autocomplete="username">
  <label for="senha">Senha</label>
  <input id="senha" type="password" autocomplete="current-password">
  <button id="entrar">Entrar</button>
  <div class="err" id="loginErr"></div>
</section>

<section id="app" class="hide">
  <header><b>Laudos de ultrassom</b><button id="sair">Sair</button></header>
  <div class="grid">
    <div class="panel left">
      <h2>Paciente</h2>
      <div class="row">
        <div><label for="nome">Nome</label><input id="nome"></div>
        <div><label for="idade">Idade</label><input id="idade" inputmode="numeric"></div>
      </div>
      <label for="exame">Tipo de exame</label>
      <select id="exame"></select>
      <h2>Medidas e achados</h2>
      <div id="campos"></div>
      <label for="extra">Achados adicionais</label>
      <textarea id="extra" rows="4"></textarea>
      <label for="concl">Conclusão</label>
      <textarea id="concl" rows="3"></textarea>
      <div class="bar" style="margin-top:16px">
        <button id="salvar">Salvar laudo</button>
        <button class="sec" id="novo">Novo paciente</button>
        <span class="msg" id="msg"></span>
      </div>
      <h2>Laudos salvos</h2>
      <div class="hist" id="hist"></div>
    </div>
    <div>
      <div class="bar">
        <button id="copiar">Copiar laudo</button>
        <button class="sec" id="imprimir">Imprimir</button>
      </div>
      <div class="report" id="laudo"></div>
    </div>
  </div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDd8SSLHbAek6z_wWYLnxqDzj5d93SAWeE",
  authDomain: "laudos-de-ultrassonografia.firebaseapp.com",
  projectId: "laudos-de-ultrassonografia",
  storageBucket: "laudos-de-ultrassonografia.firebasestorage.app",
  messagingSenderId: "136232064410",
  appId: "1:136232064410:web:128ddd7a0a8f06678bd623"
});
const auth = getAuth(app), db = getFirestore(app);

/* ---------- MODELOS DE LAUDO (edite aqui os textos padrão) ---------- */
const F = (id, label, def = "") => ({ id, label, def });
const FIG = F("fig","Fígado","de dimensões e ecotextura normais, contornos regulares");
const VB  = F("vb","Vesícula biliar","normodistendida, de paredes finas, sem cálculos");
const VBI = F("vbi","Vias biliares","sem dilatação");
const PAN = F("pan","Pâncreas","visualizado de forma habitual, de ecotextura normal");
const BAC = F("bac","Baço","de dimensões e ecotextura normais");
const RD  = F("rd","Rim direito","de topografia, dimensões e ecotextura normais; sem cálculos ou dilatação pielocalicinal");
const RE  = F("re","Rim esquerdo","de topografia, dimensões e ecotextura normais; sem cálculos ou dilatação pielocalicinal");
const BEX = F("bex","Bexiga","de repleção adequada, paredes finas e conteúdo anecoico");

const EXAMES = {
  tireoide: { nome: "Tireoide", campos: [
    F("eco","Ecotextura","homogênea"), F("ld","Lobo direito (cm)"), F("le","Lobo esquerdo (cm)"),
    F("ist","Istmo (mm)"), F("vol","Volume total (mL)"), F("nod","Nódulos / cistos","ausentes"),
    F("lin","Linfonodos cervicais","sem linfonodomegalias")],
    modelo: "Glândula tireoide em topografia habitual, de contornos regulares, com ecotextura {eco}.\nLobo direito: {ld} cm.\nLobo esquerdo: {le} cm.\nIstmo: {ist} mm.\nVolume total: {vol} mL.\nNódulos / cistos: {nod}.\nLinfonodos cervicais: {lin}." },
  abdtotal: { nome: "Abdome total", campos: [FIG,VB,VBI,PAN,BAC,RD,RE,BEX,
    F("liq","Líquido livre","ausente")],
    modelo: "Fígado: {fig}.\nVesícula biliar: {vb}.\nVias biliares: {vbi}.\nPâncreas: {pan}.\nBaço: {bac}.\nRim direito: {rd}.\nRim esquerdo: {re}.\nBexiga: {bex}.\nLíquido livre na cavidade: {liq}." },
  abdsup: { nome: "Abdome superior", campos: [FIG,VB,VBI,PAN,BAC,F("liq","Líquido livre","ausente")],
    modelo: "Fígado: {fig}.\nVesícula biliar: {vb}.\nVias biliares: {vbi}.\nPâncreas: {pan}.\nBaço: {bac}.\nLíquido livre na cavidade: {liq}." },
  urinarias: { nome: "Vias urinárias", campos: [RD,RE,BEX,F("res","Resíduo pós-miccional (mL)")],
    modelo: "Rim direito: {rd}.\nRim esquerdo: {re}.\nBexiga: {bex}.\nResíduo pós-miccional: {res} mL." },
  obst1: { nome: "Obstétrico - primeiro trimestre", campos: [
    F("pres","Gestação","tópica, única"), F("sg","Saco gestacional"), F("vit","Vesícula vitelínica","presente, de aspecto normal"),
    F("ccn","CCN (mm)"), F("ig","Idade gestacional (semanas)"), F("bcf","BCF (bpm)"),
    F("dpp","Descolamento / hematoma","ausente"), F("ov","Ovários e anexos","sem alterações")],
    modelo: "Gestação {pres}.\nSaco gestacional: {sg}.\nVesícula vitelínica: {vit}.\nComprimento cabeça-nádegas (CCN): {ccn} mm, compatível com {ig} semanas.\nBatimentos cardíacos fetais: {bcf} bpm.\nDescolamento / hematoma: {dpp}.\nOvários e anexos: {ov}." }
};

/* ---------- ESTADO E TELA ---------- */
const $ = id => document.getElementById(id);
let vals = {};
const sel = $("exame");
sel.innerHTML = Object.entries(EXAMES).map(([k,e]) => `<option value="${k}">${e.nome}</option>`).join("");

function montarCampos() {
  const ex = EXAMES[sel.value];
  vals = {};
  $("campos").innerHTML = "";
  ex.campos.forEach(c => {
    vals[c.id] = c.def;
    const l = document.createElement("label"); l.textContent = c.label; l.htmlFor = "c_" + c.id;
    const long = c.def.length > 40;
    const i = document.createElement(long ? "textarea" : "input");
    i.id = "c_" + c.id; i.value = c.def; if (long) i.rows = 2;
    i.addEventListener("input", () => { vals[c.id] = i.value; render(); });
    $("campos").append(l, i);
  });
  render();
}

function texto() {
  const ex = EXAMES[sel.value];
  const corpo = ex.modelo.replace(/\{(\w+)\}/g, (_, k) => (vals[k] || "").trim() || "___");
  const d = new Date().toLocaleDateString("pt-BR");
  let t = `ULTRASSONOGRAFIA - ${ex.nome.toUpperCase()}\n\nPaciente: ${$("nome").value || "___"}    Idade: ${$("idade").value || "___"} anos    Data: ${d}\n\n${corpo}`;
  if ($("extra").value.trim()) t += `\n\nAchados adicionais:\n${$("extra").value.trim()}`;
  if ($("concl").value.trim()) t += `\n\nConclusão:\n${$("concl").value.trim()}`;
  return t;
}
function render() { $("laudo").textContent = texto(); }
["nome","idade","extra","concl"].forEach(id => $(id).addEventListener("input", render));
sel.addEventListener("change", montarCampos);

function aviso(t) { $("msg").textContent = t; setTimeout(() => $("msg").textContent = "", 3000); }
$("copiar").onclick = async () => { try { await navigator.clipboard.writeText(texto()); aviso("Laudo copiado"); } catch { aviso("Não foi possível copiar"); } };
$("imprimir").onclick = () => window.print();
$("novo").onclick = () => { ["nome","idade","extra","concl"].forEach(i => $(i).value = ""); montarCampos(); };

/* ---------- SALVAR E ABRIR LAUDOS ---------- */
$("salvar").onclick = async () => {
  try {
    await addDoc(collection(db, "users", auth.currentUser.uid, "laudos"), {
      paciente: $("nome").value, idade: $("idade").value, exame: sel.value, campos: vals,
      extra: $("extra").value, conclusao: $("concl").value, criado: serverTimestamp()
    });
    aviso("Laudo salvo"); carregarHist();
  } catch (e) { aviso("Erro ao salvar: " + e.code); }
};
async function carregarHist() {
  const h = $("hist"); h.textContent = "";
  try {
    const s = await getDocs(query(collection(db, "users", auth.currentUser.uid, "laudos"), orderBy("criado","desc"), limit(30)));
    if (s.empty) { h.textContent = "Nenhum laudo salvo ainda."; return; }
    s.forEach(d => {
      const x = d.data(), b = document.createElement("button");
      b.className = "sec";
      const dt = x.criado ? x.criado.toDate().toLocaleDateString("pt-BR") : "";
      b.textContent = `${x.paciente || "Sem nome"} - ${EXAMES[x.exame]?.nome || x.exame} (${dt})`;
      b.onclick = () => {
        $("nome").value = x.paciente; $("idade").value = x.idade; sel.value = x.exame; montarCampos();
        Object.entries(x.campos || {}).forEach(([k,v]) => { vals[k] = v; const i = $("c_"+k); if (i) i.value = v; });
        $("extra").value = x.extra || ""; $("concl").value = x.conclusao || ""; render();
      };
      h.append(b);
    });
  } catch (e) { h.textContent = "Não foi possível carregar os laudos."; }
}

/* ---------- LOGIN ---------- */
$("entrar").onclick = async () => {
  $("loginErr").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("senha").value); }
  catch { $("loginErr").textContent = "E-mail ou senha incorretos."; }
};
$("senha").addEventListener("keydown", e => { if (e.key === "Enter") $("entrar").click(); });
$("sair").onclick = () => signOut(auth);
onAuthStateChanged(auth, u => {
  $("login").classList.toggle("hide", !!u);
  $("app").classList.toggle("hide", !u);
  if (u) { montarCampos(); carregarHist(); } else { $("senha").value = ""; }
});
</script>
</body>
</html>
